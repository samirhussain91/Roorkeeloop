<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoorkeeLoop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f6f7fb}
header{background:#0f172a;color:#fff;padding:16px 14px}
.top{display:flex;justify-content:space-between;max-width:800px;margin:auto}
.logo{font-size:24px;font-weight:900}.logo span{color:#22c55e}
.lang-btn{width:100%;max-width:800px;display:block;margin:12px auto 0;background:#22c55e;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:900;font-size:16px}
.wrap{max-width:800px;margin:auto;padding:14px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat-box{background:#fff;border-radius:18px;padding:22px;text-align:center;cursor:pointer}
.cat-box .big{font-size:42px}
.card{background:#fff;border-radius:16px;padding:18px;margin-top:12px;cursor:pointer}
.back-btn{background:#0f172a;color:#fff;border:0;padding:12px;border-radius:12px;font-weight:800;margin-bottom:12px}
footer{background:#0f172a;color:#cbd5e1;padding:20px;text-align:center;margin-top:20px}
footer a{color:#fff}
</style>
</head>
<body>
<header>
<div class="top"><div class="logo">Roorkee<span>Loop</span></div><div>● LIVE</div></div>
<button class="lang-btn" onclick="toggleLang()" id="langBtn">🌐 English Me Dekho - Tap Karo</button>
<p id="headDesc" style="max-width:800px;margin:10px auto 0;font-size:13px;color:#cbd5e1">Kisi bhi box pe tap karo - uske andar saare number milenge.</p>
</header>
<div class="wrap"><div id="list"></div></div>
<footer><p><b>RoorkeeLoop</b> - <span id="footTxt">Made for Roorkee by Samir Hussain</span></p><p>Contact: <a href="mailto:samirhussainjnb@gmail.com">samirhussainjnb@gmail.com</a></p></footer>
<script>
let lang='hi'; let currentCat=null;
let T={hi:{head:'Kisi bhi box pe tap karo - uske andar saare number milenge.',btn:'🌐 English Me Dekho - Tap Karo',back:'⬅ Wapas',cat:{emergency:['🚨','Emergency'],hospital:['🏥','Hospital'],medical:['💊','Medical'],tiffin:['🍱','Tiffin'],bus:['🚌','Bus'],train:['🚆','Train'],hotel:['🏨','Hotel']}},en:{head:'Tap any box - you will find all numbers inside.',btn:'🌐 Hindi Me Dekho - Tap Karo',back:'⬅ Back',cat:{emergency:['🚨','Emergency'],hospital:['🏥','Hospital'],medical:['💊','Medical'],tiffin:['🍱','Tiffin'],bus:['🚌','Bus'],train:['🚆','Train'],hotel:['🏨','Hotel']}}};
let data={
emergency:[['Emergency - 112','112','All Roorkee'],['Ambulance - 108','108','Roorkee'],['Police - 100','100','Civil Lines']],
hospital:[['Civil Hospital Roorkee','01332272245','Civil Lines'],['Aarogyam Hospital','01332270000','Delhi Road'],['BSM Hospital','01332271111','Ram Nagar']],
medical:[['Apollo Pharmacy','01332272222','Civil Lines'],['Jan Aushadhi','18001805555','Near Hospital']],
tiffin:[['Ghar Jaisa Tiffin','9876543210','IIT Area'],['Maa Ka Dhaba','9876543211','Civil Lines']],
bus:[['Roorkee Bus Stand','01332271100','Delhi Road'],['Delhi Bus','01332271100','Roorkee to Delhi']],
train:[['Roorkee Station','139','Station Road'],['Train Enquiry','139','All India']],
hotel:[['Hotel Royal Palace','01332274444','Delhi Road'],['Hotel Center Point','01332275555','Near Station']]
};
function toggleLang(){lang=(lang=='hi'?'en':'hi');document.getElementById('headDesc').innerText=T[lang].head;document.getElementById('langBtn').innerText=T[lang].btn;render();}
function render(){
let list=document.getElementById('list');
if(!currentCat){
let html='<div class="cat-grid">';
['emergency','hospital','medical','tiffin','bus','train','hotel'].forEach(c=>{html+=`<div class="cat-box" onclick="openCat('${c}')"><div class="big">${T[lang].cat[c][0]}</div><h3>${T[lang].cat[c][1]}</h3><p>Tap Karo →</p></div>`});
html+='</div>'; list.innerHTML=html; return;
}
let html=`<button class="back-btn" onclick="goHome()">${T[lang].back}</button>`;
data[currentCat].forEach(d=>{html+=`<div class="card"><h3>${d[0]}</h3><p>📍 ${d[2]}</p><p>📞 <a href="tel:${d[1]}">${d[1]}</a></p></div>`});
list.innerHTML=html;
}
function openCat(c){currentCat=c;render();}
function goHome(){currentCat=null;render();}
render();
</script>
</body>
</html>
