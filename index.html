<title>RoorkeeLoop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f6f7fb;color:#111}
header{background:#0f172a;color:#fff;padding:16px 14px;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center;max-width:800px;margin:auto}
.logo{font-size:24px;font-weight:900}.logo span{color:#22c55e}
.badge{background:#22c55e;color:#fff;font-size:11px;padding:4px 8px;border-radius:20px}
.lang-btn{width:100%;max-width:800px;display:block;margin:12px auto 0;background:#22c55e;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer}
header p{max-width:800px;margin:10px auto 0;color:#cbd5e1;font-size:13px}
.search-box{max-width:800px;margin:12px auto;background:#fff;border-radius:14px;display:flex;overflow:hidden}
.search-box input{flex:1;border:0;padding:14px;outline:none;font-size:15px}
.search-box button{border:0;background:#fff;padding:0 12px;font-size:20px;cursor:pointer}
.mic-btn{border-left:1px solid #eee !important;background:#fef3c7 !important}
.go-btn{background:#22c55e !important;color:#fff !important;font-weight:800;padding:0 18px !important}
.wrap{max-width:800px;margin:auto;padding:14px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.cat-box{background:#fff;border-radius:18px;padding:22px 14px;text-align:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid #eef2f7}
.cat-box:active{transform:scale(.97);background:#f0fdf4}
.cat-box .big{font-size:42px}
.cat-box h3{font-size:16px;margin:10px 0 4px}
.cat-box p{font-size:12px;color:#64748b}
.cat-box .count{background:#22c55e;color:#fff;font-size:11px;padding:3px 10px;border-radius:20px;display:inline-block;margin-top:8px;font-weight:700}
.back-btn{background:#0f172a;color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;margin-bottom:12px}
.sec-title{font-size:19px;font-weight:900;margin:6px 0 12px;background:#fff;padding:12px;border-radius:12px;border-left:5px solid #22c55e}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:#fff;border-radius:16px;padding:18px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card .icon{font-size:32px}
.card h3{font-size:17px;margin:8px 0 4px}
.card p{font-size:13px;color:#64748b;line-height:1.5}
.card .meta{font-size:12px;color:#16a34a;font-weight:700;margin-top:10px}
footer{background:#0f172a;color:#cbd5e1;padding:20px 14px;text-align:center;margin-top:20px}
footer a{color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow:auto}
.sheet h2{font-size:20px}.sheet p{color:#64748b;font-size:13px;margin:8px 0;line-height:1.5}
.close{float:right;font-size:22px;cursor:pointer}
.big-btn{display:block;text-align:center;padding:13px;border-radius:12px;margin-top:10px;text-decoration:none;font-weight:800}
.mic-status{text-align:center;font-size:12px;color:#fff;background:#dc2626;padding:6px;border-radius:8px;margin-top:8px;display:none}
</style>
</head>
