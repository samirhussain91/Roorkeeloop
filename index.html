<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoorkeeLoop - Roorkee Ki Sab Kuch Ek Jagah</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f6f7fb;color:#111}
header{background:#0f172a;color:#fff;padding:18px 14px 14px;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:auto}
.logo{font-size:24px;font-weight:900}.logo span{color:#22c55e}
.badge{background:#22c55e;color:#fff;font-size:11px;padding:4px 8px;border-radius:20px}
header p{max-width:1000px;margin:8px auto 0;color:#cbd5e1;font-size:13px}
.search-box{max-width:1000px;margin:14px auto;background:#fff;border-radius:14px;display:flex;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.search-box input{flex:1;border:0;padding:14px;outline:none;font-size:15px}
.search-box button{border:0;background:#fff;padding:0 12px;font-size:20px;cursor:pointer}
.mic-btn{border-left:1px solid #eee !important;background:#fef3c7 !important}
.go-btn{background:#22c55e !important;color:#fff !important;font-weight:800;padding:0 18px !important}
.wrap{max-width:1000px;margin:auto;padding:14px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:6px}
.tab{white-space:nowrap;border:1px solid #e2e8f0;background:#fff;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:700}
.tab.active{background:#0f172a;color:#fff;border-color:#0f172a}
.sec-title{font-size:18px;font-weight:900;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:#fff;border-radius:16px;padding:16px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1px solid #eef2f7}
.card:active{transform:scale(.97)}
.card .icon{font-size:30px}
.card h3{font-size:15px;margin:8px 0 4px}
.card p{font-size:12px;color:#64748b;line-height:1.4}
.card .meta{font-size:11px;color:#16a34a;font-weight:700;margin-top:8px}
footer{background:#0f172a;color:#cbd5e1;padding:20px 14px;text-align:center;margin-top:20px}
footer a{color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow:auto}
.sheet h2{font-size:20px}.sheet p{color:#64748b;font-size:13px;margin:8px 0;line-height:1.5}
.close{float:right;font-size:22px;cursor:pointer}
.big-btn{display:block;text-align:center;padding:13px;border-radius:12px;margin-top:10px;text-decoration:none;font-weight:800}
.mic-status{text-align:center;font-size:12px;color:#fff;background:#dc2626;padding:6px;border-radius:8px;margin-top:8px;display:none}
</style>
</head>
<body>

<header>
<div class="top"><div class="logo">Roorkee<span>Loop</span></div><div class="badge">● LIVE • ROORKEE</div></div>
<p>Roorkee ki saari zaroori cheezein ek jagah - Hospital, Dawa, Tiffin, Bus, Train, Hotel.</p>
<div class="search-box">
<input id="searchInput" placeholder="Kya chahiye? Hospital, Tiffin, Bus..." oninput="filterCards()">
<button class="mic-btn" onclick="startMic()" title="Bolo">🎤</button>
<button class="go-btn" onclick="filterCards()">Search</button>
</div>
<div id="micStatus" class="mic-status"></div>
</header>

<div class="wrap">
<div class="tabs" id="tabs">
<button class="tab active" onclick="showCat('all',this)">Sab Kuch</button>
<button class="tab" onclick="showCat('emergency',this)">🚨 Emergency</button>
<button class="tab" onclick="showCat('hospital',this)">🏥 Hospital</button>
<button class="tab" onclick="showCat('medical',this)">💊 Medical / Dawa</button>
<button class="tab" onclick="showCat('tiffin',this)">🍱 Tiffin</button>
<button class="tab" onclick="showCat('bus',this)">🚌 Bus</button>
<button class="tab" onclick="showCat('train',this)">🚆 Train</button>
<button class="tab" onclick="showCat('hotel',this)">🏨 Hotel</button>
</div>
<div id="list"></div>
</div>

<footer>
<p><b>RoorkeeLoop</b> - Made for Roorkee by Samir Hussain</p>
<p style="margin-top:8px">Contact: <a href="mailto:samirhussainjnb@gmail.com">samirhussainjnb@gmail.com</a></p>
<p style="margin-top:6px;font-size:12px">Emergency: 112 • Ambulance: 108 • Police: 100</p>
</footer>

<div class="modal" id="modal" onclick="if(event.target==this)closeModal()">
<div class="sheet">
<span class="close" onclick="closeModal()">✕</span>
<h2 id="mTitle"></h2>
<p id="mDesc"></p>
<p id="mAddr" style="color:#111;font-weight:700"></p>
<p id="mPhone" style="color:#111;font-weight:700;font-size:16px"></p>
<a id="mCall" class="big-btn" style="background:#22c55e;color:#fff" href="#">📞 Call Karo</a>
<a id="mMap" class="big-btn" style="background:#2563eb;color:#fff" target="_blank" href="#">📍 Google Map Me Dekho</a>
<button class="big-btn" style="background:#f1f5f9;border:0;width:100%;cursor:pointer" onclick="closeModal()">Band Karo</button>
</div>
</div>

<script>
const data=[
{cat:'emergency',icon:'🚨',name:'Emergency - 112',desc:'Koi bhi emergency ho toh pehle ye number lagao.',addr:'All Roorkee, Uttarakhand',phone:'112'},
{cat:'emergency',icon:'🚑',name:'Ambulance - 108',desc:'Free Ambulance service, 24 ghante.',addr:'Roorkee, Uttarakhand',phone:'108'},
{cat:'emergency',icon:'👮',name:'Roorkee Police - 100',desc:'Police help, FIR, emergency.',addr:'Civil Lines, Roorkee',phone:'100'},
{cat:'hospital',icon:'🏥',name:'Civil Hospital Roorkee',desc:'Sarkari Hospital - OPD, Emergency, Delivery.',addr:'Civil Lines, Roorkee, Uttarakhand 247667',phone:'01332272245'},
{cat:'hospital',icon:'🏥',name:'Aarogyam Hospital',desc:'Private Hospital - 24x7 Emergency, ICU, Surgery.',addr:'Delhi Road, Roorkee',phone:'01332270000'},
{cat:'hospital',icon:'🏥',name:'B.S.M. Hospital',desc:'Multi-speciality, Child & General Physician.',addr:'Ram Nagar, Roorkee',phone:'01332271111'},
{cat:'hospital',icon:'🏥',name:'IIT Roorkee Hospital',desc:'IIT Campus Hospital - Students & Staff ke liye.',addr:'IIT Roorkee Campus, Roorkee',phone:'01332285000'},
{cat:'medical',icon:'💊',name:'Apollo Pharmacy',desc:'Dawa, 24x7 available. Home delivery bhi hai.',addr:'Civil Lines, Roorkee',phone:'01332272222'},
{cat:'medical',icon:'💊',name:'Jan Aushadhi Kendra',desc:'Sasti Generic Dawa - 50-80% tak sasti.',addr:'Near Civil Hospital, Roorkee',phone:'18001805555'},
{cat:'medical',icon:'💊',name:'MedPlus Pharmacy',desc:'Dawa + Health checkup.',addr:'Main Market, Roorkee',phone:'01332273333'},
{cat:'medical',icon:'💊',name:'Sharma Medical Store',desc:'Purani aur bharosemand dukaan.',addr:'Railway Road, Roorkee',phone:'9837000000'},
{cat:'tiffin',icon:'🍱',name:'Ghar Jaisa Tiffin',desc:'Roz ka ghar jaisa khana - Dal, Roti, Sabzi, Salad.',addr:'IIT Area, Roorkee',phone:'9876543210'},
{cat:'tiffin',icon:'🍱',name:'Maa Ka Dhaba Tiffin',desc:'Shuddh veg tiffin, Lunch + Dinner. Monthly plan.',addr:'Civil Lines, Roorkee',phone:'9876543211'},
{cat:'tiffin',icon:'🍱',name:'Roorkee Tiffin Service',desc:'Office aur Hostel delivery. Morning / Evening dono time.',addr:'Ram Nagar, Roorkee',phone:'9876543212'},
{cat:'bus',icon:'🚌',name:'Roorkee Bus Stand',desc:'Delhi, Haridwar, Dehradun, Saharanpur ke liye bus yaha se milti hai.',addr:'Delhi Road, Roorkee Bus Stand',phone:'01332271100'},
{cat:'bus',icon:'🚌',name:'Delhi - Roorkee Bus',desc:'Har 30 min me bus. Kiraya ~ Rs. 150-200. Time ~ 3.5 ghante.',addr:'Roorkee to ISBT Delhi',phone:'01332271100'},
{cat:'bus',icon:'🚌',name:'Haridwar - Roorkee Bus',desc:'Har 15 min me bus. Kiraya ~ Rs. 40. Time ~ 45 min.',addr:'Roorkee to Haridwar',phone:'01332271100'},
{cat:'train',icon:'🚆',name:'Roorkee Railway Station',desc:'Station Code: RK. Delhi, Dehradun, Haridwar ke liye train.',addr:'Station Road, Roorkee 247667',phone:'139'},
{cat:'train',icon:'🚆',name:'Train Enquiry - 139',desc:'PNR, Train timing, Seat availability ke liye call karo.',addr:'All India',phone:'139'},
{cat:'hotel',icon:'🏨',name:'Hotel Royal Palace',desc:'Family stay, AC Room, Food available.',addr:'Delhi Road, Roorkee',phone:'01332274444'},
{cat:'hotel',icon:'🏨',name:'Hotel Center Point',desc:'Station ke paas, Budget hotel.',addr:'Near Railway Station, Roorkee',phone:'01332275555'},
{cat:'hotel',icon:'🏨',name:'PG / Room - Students',desc:'IIT ke paas PG, Single / Sharing room.',addr:'IIT Area, Roorkee',phone:'9876543213'},
];
let currentCat='all';
function render(){
  let q=document.getElementById('searchInput').value.toLowerCase();
  let list=document.getElementById('list');
  let filtered=data.filter(d=>(currentCat=='all'||d.cat==currentCat)&&(d.name.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.addr.toLowerCase().includes(q)));
  if(filtered.length==0){list.innerHTML='<p style="text-align:center;padding:30px;color:#64748b">Kuch nahi mila. Dusra naam likh ke try karo.</p>';return;}
  let cats=[...new Set(filtered.map(d=>d.cat))];
  let html='';
  cats.forEach(c=>{
    let title={emergency:'🚨 Emergency',hospital:'🏥 Hospital',medical:'💊 Medical / Dawa',tiffin:'🍱 Tiffin / Khana',bus:'🚌 Bus',train:'🚆 Train',hotel:'🏨 Hotel / Rehne'}[c];
    html+=`<div class="sec-title">${title}</div><div class="grid">`;
    filtered.filter(d=>d.cat==c).forEach((d)=>{
      let idx=data.indexOf(d);
      html+=`<div class="card" onclick="openModal(${idx})">
      <div class="icon">${d.icon}</div><h3>${d.name}</h3><p>${d.desc}</p>
      <div class="meta">Tap karke Number & Map dekho →</div></div>`;
    });
    html+=`</div>`;
  });
  list.innerHTML=html;
}
function showCat(c,el){currentCat=c;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render();}
function filterCards(){render();}
function openModal(idx){
  let d=data[idx];
  document.getElementById('mTitle').innerText=d.icon+' '+d.name;
  document.getElementById('mDesc').innerText=d.desc;
  document.getElementById('mAddr').innerText='📍 Address: '+d.addr;
  document.getElementById('mPhone').innerText='📞 Number: '+d.phone;
  document.getElementById('mCall').href='tel:'+d.phone;
  document.getElementById('mCall').innerText='📞 Call Karo - '+d.phone;
  document.getElementById('mMap').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.name+' '+d.addr);
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function showMicMsg(msg){let el=document.getElementById('micStatus');el.style.display='block';el.innerText=msg;setTimeout(()=>{el.style.display='none'},4000);}
async function startMic(){
  try{
    await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    showMicMsg('Mic Block hai! Upar Lock 🔒 > Microphone > Allow karo > Refresh karo');
    alert('Mic Block hai!\n\nUpar address bar me Lock 🔒 icon pe click karo\n> Microphone > Allow karo\n> Fir page Refresh karo\n> Fir Mic dabao');
    return;
  }
  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Mic is browser me nahi chalega. Chrome me kholo.');return;}
  let rec=new SR();
  rec.lang='hi-IN';
  rec.onresult=(e)=>{
    let text=e.results[0][0].transcript;
    document.getElementById('searchInput').value=text;
    render();
    showMicMsg('Tune bola: '+text);
  };
  rec.onerror=(e)=>{showMicMsg('Mic Error: Lock icon se Allow karo');};
  rec.start();
  showMicMsg('🎤 Sun raha hu... Bolo - Hospital, Tiffin, Bus...');
}
render();
</script>
</body>
  </html>
